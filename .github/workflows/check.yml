name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compiles
        run: python3 -m py_compile bageo_bluetooth.py
      - name: Shell scripts
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          shellcheck -S warning -s sh install.sh uninstall.sh
